name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: mypy agentguard/

  audit-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,sandbox,verify,observability]"
      # The runner image pins an older setuptools with known advisories
      # (e.g. PYSEC-2026-3447); it is build tooling, not a declared
      # dependency, so upgrade it in this environment before auditing.
      - run: pip install --upgrade "setuptools>=83"
      - name: pip-audit (known vulnerabilities in installed dependencies)
        run: pip-audit --desc on  # no --strict: the editable local package itself is unauditable

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run unit tests
        env:
          AGENTGUARD_AUDIT_KEY: ci-test-key-0123456789abcdef0123456789abcdef
        run: pytest tests/unit/ -v --cov=agentguard --cov-report=term-missing --cov-fail-under=80

  integration:
    # Docker CLI + daemon are available on GitHub-hosted ubuntu runners; the
    # sandbox backend talks to the runner's own socket via docker.from_env().
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,sandbox]"
      - run: docker pull python:3.11-slim
      - name: Verify Docker SDK and daemon
        run: |
          python - <<'PY'
          import docker

          client = docker.from_env()
          try:
              if not client.ping():
                  raise RuntimeError("Docker daemon ping failed")
          finally:
              client.close()
          PY
      - name: Run integration + red-team (sandbox escape) tests
        env:
          AGENTGUARD_AUDIT_KEY: ci-test-key-0123456789abcdef0123456789abcdef
        # --no-cov: the global addopts enforce --cov-fail-under=80, which is
        # meaningless for this 7-test subset and would always fail the job.
        run: pytest tests/integration tests/red_team -m "integration or red_team" -v --no-cov

  adapter-extras:
    name: Adapter extras (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [langgraph, crewai, adk, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv sync --frozen --extra dev --extra ${{ matrix.extra }}
      - name: Run native adapter boundary tests
        env:
          AGENTGUARD_AUDIT_KEY: ci-test-key-0123456789abcdef0123456789abcdef
        run: uv run pytest tests/unit/integrations/test_real_adapters.py -v --no-cov

  finance-extra:
    # The WGAN-GP determinism tests importorskip torch, so without this job
    # the seeded-training claims would never be exercised anywhere.
    name: Finance extra (torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv sync --frozen --extra dev --extra finance
      - name: Run WGAN-GP + synthetic data tests
        env:
          AGENTGUARD_AUDIT_KEY: ci-test-key-0123456789abcdef0123456789abcdef
        run: uv run pytest tests/unit/domains/finance/test_wgan_gp.py tests/unit/domains/finance/test_generators.py -v --no-cov
